    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#23384f" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)" />
